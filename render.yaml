services:
  - type: web
    name: photobooth
    runtime: python
    plan: free
    buildCommand: |
      pip install -r api/requirements.txt
      cd react-frontend && npm install && npm run build
    startCommand: gunicorn api.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        fromDatabase:
          name: photobooth-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET_NAME
        value: photobooth-abby-bernie

databases:
  - name: photobooth-db
    databaseName: photobooth
    user: photobooth_user
    plan: free