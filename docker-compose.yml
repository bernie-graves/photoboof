services:
  db:
    image: postgres:15
    container_name: photobooth-db
    environment:
      POSTGRES_USER: photobooth
      POSTGRES_PASSWORD: photobooth_password
      POSTGRES_DB: photobooth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobooth"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: photobooth-web
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://photobooth:photobooth_password@db:5432/photobooth
      - SECRET_KEY=dev-secret-key-change-in-production
      - ADMIN_PASSWORD=admin123
      - AWS_REGION=us-east-2
      - S3_BUCKET_NAME=photobooth-abby-bernie
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: